<!doctype html>
<html>
  <head>
    <title>I COUNT</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="stylesheet.css" />
  </head>
  <body class="allhold" id="out">
    <button class="wrap" id="touch">
      <h1 class="counted" id="show">0</h1>
    </button>
    <div class="container">
      <button class="addbtn" id="add">+</button>
      <button class="resetbtn" id="clear">RESET</button>
      <button class="clearbtn" id="minus">-</button>
    </div>
    <script src="adddecrease.js"></script>
  </body>
</html>
